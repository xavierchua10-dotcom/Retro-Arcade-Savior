<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Arcade 20 — by Savior</title>
<meta name="description" content="Retro Arcade 20 — a synthwave arcade cabinet with 20 games to play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0118;
    --deep:#1a0b33;
    --purple:#a855f7;
    --purple-deep:#6d28d9;
    --pink:#ff2e97;
    --cyan:#00f0ff;
    --amber:#ffcc33;
    --text:#ece3fb;
    --text-dim:#9c8bc4;
    --card-bg:rgba(24,10,48,0.55);
    --card-border:rgba(168,85,247,0.35);
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--void);
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    overflow-x:hidden;
    position:relative;
  }

  ::selection{background:var(--pink);color:var(--void);}

  a{color:inherit;text-decoration:none;}

  :focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:3px;
    border-radius:4px;
  }

  /* ---------- Synthwave background ---------- */
  .synth-bg{
    position:fixed;
    inset:0;
    z-index:-2;
    background:radial-gradient(ellipse 90% 60% at 50% 8%, var(--deep) 0%, var(--void) 65%);
    overflow:hidden;
  }

  .sun{
    position:absolute;
    top:6%;
    left:50%;
    width:min(360px,45vw);
    height:min(360px,45vw);
    transform:translateX(-50%);
    border-radius:50%;
    background:linear-gradient(180deg, var(--amber) 0%, var(--pink) 45%, var(--purple) 85%);
    box-shadow:0 0 140px 40px rgba(255,46,151,0.35), 0 0 60px 10px rgba(255,204,51,0.25);
    -webkit-mask-image:repeating-linear-gradient(to bottom, black 0px, black 5px, transparent 5px, transparent 11px);
    mask-image:repeating-linear-gradient(to bottom, black 0px, black 5px, transparent 5px, transparent 11px);
    -webkit-mask-size:100% 220px;
    mask-size:100% 220px;
    -webkit-mask-position:bottom;
    mask-position:bottom;
    animation:sunPulse 6s ease-in-out infinite;
  }

  @keyframes sunPulse{
    0%,100%{opacity:0.9;}
    50%{opacity:1;}
  }

  .grid-floor{
    position:absolute;
    bottom:0;
    left:-60%;
    width:220%;
    height:48%;
    background-image:
      linear-gradient(rgba(0,240,255,0.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.55) 1px, transparent 1px);
    background-size:64px 64px;
    transform:perspective(280px) rotateX(64deg);
    transform-origin:bottom;
    -webkit-mask-image:linear-gradient(to top, black 0%, transparent 88%);
    mask-image:linear-gradient(to top, black 0%, transparent 88%);
    animation:gridMove 2.4s linear infinite;
  }

  @keyframes gridMove{
    from{background-position:0 0, 0 0;}
    to{background-position:0 64px, 0 0;}
  }

  .horizon-glow{
    position:absolute;
    bottom:47%;
    left:0;
    width:100%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--pink), var(--cyan), transparent);
    box-shadow:0 0 20px 2px var(--cyan);
    opacity:0.7;
  }

  .scanlines{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 2px, transparent 4px);
    mix-blend-mode:overlay;
    opacity:0.6;
  }

  .particle{
    position:fixed;
    z-index:-1;
    border-radius:50%;
    pointer-events:none;
    animation:drift linear infinite;
  }

  @keyframes drift{
    from{transform:translateY(0);opacity:0;}
    10%{opacity:1;}
    90%{opacity:1;}
    to{transform:translateY(-110vh);opacity:0;}
  }

  /* ---------- Layout ---------- */
  .wrap{
    max-width:1280px;
    margin:0 auto;
    padding:0 24px 80px;
    position:relative;
    z-index:1;
  }

  header.hero{
    text-align:center;
    padding:min(14vh,120px) 20px 40px;
    position:relative;
  }

  .eyebrow{
    font-family:'Press Start 2P',monospace;
    font-size:0.55rem;
    letter-spacing:0.35em;
    color:var(--cyan);
    text-shadow:0 0 8px rgba(0,240,255,0.8);
    display:inline-block;
    margin-bottom:22px;
    opacity:0.85;
  }

  h1.title{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(2.4rem, 8vw, 5.2rem);
    margin:0;
    letter-spacing:0.04em;
    line-height:1;
    color:#fff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.6),
      0 0 22px var(--purple),
      0 0 46px var(--pink),
      0 0 80px rgba(0,240,255,0.35);
    position:relative;
    display:inline-block;
    animation:titleFlicker 5.5s ease-in-out infinite;
  }

  h1.title::before,
  h1.title::after{
    content:'RETRO ARCADE 20';
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, transparent, transparent);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:none;
  }

  h1.title::before{
    color:var(--pink);
    opacity:0;
    transform:translate(0);
    animation:glitchTop 5.5s steps(1) infinite;
  }
  h1.title::after{
    color:var(--cyan);
    opacity:0;
    transform:translate(0);
    animation:glitchBottom 5.5s steps(1) infinite;
  }

  @keyframes titleFlicker{
    0%,93%,100%{opacity:1;}
    94%{opacity:0.75;}
    95%{opacity:1;}
    96%{opacity:0.6;}
    97%{opacity:1;}
  }
  @keyframes glitchTop{
    0%,92%,100%{opacity:0;transform:translate(0,0);}
    92.5%{opacity:0.7;transform:translate(-3px,-1px);}
    93.5%{opacity:0;}
  }
  @keyframes glitchBottom{
    0%,92%,100%{opacity:0;transform:translate(0,0);}
    92.5%{opacity:0.7;transform:translate(3px,1px);}
    93.5%{opacity:0;}
  }

  p.credit{
    margin:18px 0 0;
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:0.5em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  p.credit span{
    color:var(--pink);
    text-shadow:0 0 10px rgba(255,46,151,0.8);
  }

  p.tagline{
    max-width:560px;
    margin:26px auto 0;
    color:var(--text-dim);
    font-size:1.05rem;
    line-height:1.5;
  }

  /* ---------- Game grid ---------- */
  .arcade-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:26px;
    margin-top:20px;
  }

  .card{
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:26px 22px 24px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    opacity:0;
    transform:translateY(24px);
    animation:cardIn 0.6s ease forwards;
    animation-delay:calc(var(--i) * 0.045s);
    transition:transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }

  @keyframes cardIn{
    to{opacity:1;transform:translateY(0);}
  }

  .card:hover, .card:focus-within{
    transform:translateY(-8px);
    border-color:var(--cyan);
    box-shadow:0 18px 40px rgba(0,0,0,0.45), 0 0 30px rgba(0,240,255,0.25), inset 0 0 20px rgba(168,85,247,0.12);
  }

  .card-num{
    position:absolute;
    top:10px;
    right:14px;
    font-family:'Press Start 2P',monospace;
    font-size:0.6rem;
    color:rgba(255,255,255,0.18);
    letter-spacing:0.05em;
  }

  .badge{
    width:74px;
    height:74px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.1rem;
    margin-bottom:16px;
    background:radial-gradient(circle at 35% 30%, rgba(168,85,247,0.35), rgba(10,1,24,0.4));
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 0 24px rgba(168,85,247,0.45), inset 0 0 14px rgba(0,240,255,0.15);
    transition:box-shadow 0.35s ease, transform 0.35s ease;
  }
  .card:hover .badge{
    transform:scale(1.08);
    box-shadow:0 0 34px rgba(255,46,151,0.6), inset 0 0 16px rgba(0,240,255,0.25);
  }

  h2.game-title{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:1.3rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:0 0 10px;
    color:#fff;
  }

  p.desc{
    font-size:0.95rem;
    line-height:1.45;
    color:var(--text-dim);
    margin:0 0 22px;
    min-height:44px;
  }

  .play-btn{
    margin-top:auto;
    font-family:'Press Start 2P',monospace;
    font-size:0.62rem;
    letter-spacing:0.12em;
    padding:12px 26px;
    border-radius:999px;
    border:1px solid var(--cyan);
    color:var(--cyan);
    background:transparent;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:all 0.3s ease;
    box-shadow:0 0 0 rgba(0,240,255,0);
  }

  .play-btn::before{
    content:'▶';
    font-size:0.55rem;
  }

  .play-btn:hover, .play-btn:focus-visible{
    background:linear-gradient(90deg, var(--purple), var(--pink));
    color:#fff;
    border-color:transparent;
    box-shadow:0 0 24px rgba(255,46,151,0.65), 0 0 12px rgba(0,240,255,0.4);
    transform:translateY(-2px);
  }

  footer{
    text-align:center;
    margin-top:70px;
    color:var(--text-dim);
    font-size:0.8rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
  }

  @media (max-width:480px){
    p.credit{letter-spacing:0.3em;}
    .arcade-grid{grid-template-columns:repeat(auto-fill, minmax(200px,1fr));gap:18px;}
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="synth-bg" aria-hidden="true">
    <div class="sun"></div>
    <div class="horizon-glow"></div>
    <div class="grid-floor"></div>
  </div>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="wrap">
    <header class="hero">
      <span class="eyebrow">Insert Coin</span>
      <h1 class="title">RETRO ARCADE 20</h1>
      <p class="credit">by <span>Savior</span></p>
      <p class="tagline">Twenty cabinets, twenty worlds. Pick your game and chase the high score.</p>
    </header>

    <main>
      <section class="arcade-grid" id="gameGrid" aria-label="Game selection"></section>
    </main>

    <footer>© 2026 Retro Arcade 20 — Built by Savior</footer>
  </div>

<script>
  const games = [
    { emoji:'🕹️', desc:'Grab the stick and chase the high score that never sleeps.' },
    { emoji:'🚗', desc:'Redline through neon streets where every second counts.' },
    { emoji:'🐍', desc:'Eat, grow, and never look back — one wrong turn ends it all.' },
    { emoji:'🚀', desc:'Blast through asteroid fields with nothing but reflexes and grit.' },
    { emoji:'👾', desc:'Waves of invaders descend — hold the line or go down swinging.' },
    { emoji:'🏓', desc:'Two paddles, one ball, zero mercy.' },
    { emoji:'🧱', desc:'Smash every brick before the ball smashes your last life.' },
    { emoji:'🎯', desc:'Steady hands, sharp eyes — the bullseye won\'t wait.' },
    { emoji:'🥊', desc:'Trade blows in the arena until only one fighter stands.' },
    { emoji:'🏎️', desc:'Drift, boost, and outrun the pack to the checkered flag.' },
    { emoji:'🧩', desc:'Twist, rotate, and clear the board before it clears you.' },
    { emoji:'🃏', desc:'Bluff, deal, and outsmart the house one hand at a time.' },
    { emoji:'🎳', desc:'Line up the shot and send every pin flying.' },
    { emoji:'🏹', desc:'Draw, aim, release — precision is the only path to gold.' },
    { emoji:'🛸', desc:'Beam up loot while dodging the searchlights below.' },
    { emoji:'🐉', desc:'Slay legends and hoard treasure in a pixelated realm.' },
    { emoji:'⚡', desc:'Race the clock in a sprint where milliseconds matter.' },
    { emoji:'🎰', desc:'Pull the lever and let fate decide your fortune.' },
    { emoji:'🏆', desc:'Face the final boss in the ultimate arcade showdown.' },
    { emoji:'👻', desc:'Outrun the ghosts through a maze that never ends.' }
  ];

  const grid = document.getElementById('gameGrid');

  games.forEach((g, idx) => {
    const n = idx + 1;
    const card = document.createElement('article');
    card.className = 'card';
    card.style.setProperty('--i', n);
    card.innerHTML = `
      <span class="card-num">N${String(n).padStart(2,'0')}</span>
      <div class="badge" aria-hidden="true">${g.emoji}</div>
      <h2 class="game-title">Game ${n}</h2>
      <p class="desc">${g.desc}</p>
      <a class="play-btn" href="game${n}.html">Play</a>
    `;
    grid.appendChild(card);
  });

  // ambient floating particles
  const colors = ['#00f0ff', '#ff2e97', '#a855f7', '#ffcc33'];
  const particleCount = window.innerWidth < 600 ? 14 : 28;
  for (let i = 0; i < particleCount; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 3;
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top = 100 + Math.random() * 20 + 'vh';
    p.style.background = color;
    p.style.boxShadow = `0 0 ${6 + size * 2}px ${color}`;
    p.style.animationDuration = (8 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    document.body.appendChild(p);
  }
</script>
</body>
</html>
