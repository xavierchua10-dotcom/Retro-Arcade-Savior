<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Redline — Game 02 — Retro Arcade 20</title>
<meta name="description" content="Redline — dodge traffic on a neon highway that never stops accelerating. Game 2 of Retro Arcade 20, by Savior.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0118;
    --deep:#1a0b33;
    --purple:#a855f7;
    --purple-deep:#6d28d9;
    --pink:#ff2e97;
    --cyan:#00f0ff;
    --amber:#ffcc33;
    --red:#ff3b3b;
    --text:#ece3fb;
    --text-dim:#9c8bc4;
    --card-bg:rgba(24,10,48,0.55);
    --card-border:rgba(168,85,247,0.35);
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--void);
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    overflow-x:hidden;
    position:relative;
  }

  ::selection{background:var(--pink);color:var(--void);}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:4px;}

  /* ---------- Synthwave background ---------- */
  .synth-bg{
    position:fixed;
    inset:0;
    z-index:-2;
    background:radial-gradient(ellipse 90% 60% at 50% 6%, var(--deep) 0%, var(--void) 65%);
    overflow:hidden;
  }
  .sun{
    position:absolute;
    top:4%;
    left:50%;
    width:min(300px,40vw);
    height:min(300px,40vw);
    transform:translateX(-50%);
    border-radius:50%;
    background:linear-gradient(180deg, var(--amber) 0%, var(--pink) 45%, var(--purple) 85%);
    box-shadow:0 0 140px 40px rgba(255,46,151,0.3), 0 0 60px 10px rgba(255,204,51,0.2);
    -webkit-mask-image:repeating-linear-gradient(to bottom, black 0px, black 5px, transparent 5px, transparent 11px);
    mask-image:repeating-linear-gradient(to bottom, black 0px, black 5px, transparent 5px, transparent 11px);
    -webkit-mask-size:100% 220px;
    mask-size:100% 220px;
    -webkit-mask-position:bottom;
    mask-position:bottom;
    opacity:0.55;
  }
  .horizon-glow{
    position:absolute;
    top:min(240px,36vw);
    left:0;
    width:100%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--pink), var(--cyan), transparent);
    box-shadow:0 0 20px 2px var(--cyan);
    opacity:0.5;
  }
  .scanlines{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 2px, transparent 4px);
    mix-blend-mode:overlay;
    opacity:0.6;
  }

  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:0 20px 60px;
    position:relative;
    z-index:1;
  }

  header.hero{
    text-align:center;
    padding:min(6vh,48px) 10px 22px;
    position:relative;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    padding:8px 4px;
    transition:color 0.25s ease;
  }
  .back-link:hover, .back-link:focus-visible{color:var(--cyan);}
  .back-link::before{content:'◀';font-size:0.7rem;}

  .eyebrow{
    font-family:'Press Start 2P',monospace;
    font-size:0.55rem;
    letter-spacing:0.35em;
    color:var(--cyan);
    text-shadow:0 0 8px rgba(0,240,255,0.8);
    display:inline-block;
    margin:18px 0 16px;
    opacity:0.85;
  }

  h1.title{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(2.2rem, 12vw, 3.4rem);
    margin:0;
    letter-spacing:0.05em;
    line-height:1;
    color:#fff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.6),
      0 0 22px var(--purple),
      0 0 46px var(--pink),
      0 0 80px rgba(0,240,255,0.35);
  }

  p.credit{
    margin:14px 0 0;
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.4em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  p.credit span{color:var(--pink);text-shadow:0 0 10px rgba(255,46,151,0.8);}

  /* ---------- Game frame ---------- */
  .arcade-cabinet{
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:16px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 18px 50px rgba(0,0,0,0.5), inset 0 0 30px rgba(168,85,247,0.08);
    margin-top:10px;
  }

  .hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:2px 6px 14px;
    font-family:'Press Start 2P',monospace;
  }
  .hud .stat{display:flex;flex-direction:column;gap:4px;}
  .hud .stat-label{
    font-size:0.5rem;
    letter-spacing:0.15em;
    color:var(--text-dim);
  }
  .hud .stat-value{
    font-size:0.85rem;
    color:var(--cyan);
    text-shadow:0 0 10px rgba(0,240,255,0.6);
  }
  .hud .stat-value.best{color:var(--amber);text-shadow:0 0 10px rgba(255,204,51,0.6);}

  .mute-btn{
    background:transparent;
    border:1px solid var(--card-border);
    color:var(--text-dim);
    width:34px;
    height:34px;
    border-radius:10px;
    font-size:1rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all 0.25s ease;
  }
  .mute-btn:hover, .mute-btn:focus-visible{border-color:var(--cyan);color:var(--cyan);}

  .canvas-wrap{
    position:relative;
    width:100%;
    aspect-ratio:9/13;
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:inset 0 0 40px rgba(0,0,0,0.6);
    touch-action:none;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:16px;
    padding:24px;
    background:rgba(10,1,24,0.72);
    backdrop-filter:blur(4px);
    transition:opacity 0.3s ease;
  }
  .overlay.hidden{display:none;}

  .overlay h2{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:1.8rem;
    margin:0;
    color:#fff;
    letter-spacing:0.03em;
    text-shadow:0 0 18px var(--purple), 0 0 40px var(--pink);
  }
  .overlay h2.crash{text-shadow:0 0 18px var(--red), 0 0 40px var(--pink);}

  .overlay p{
    margin:0;
    color:var(--text-dim);
    font-size:0.95rem;
    line-height:1.5;
    max-width:280px;
  }

  .overlay .score-line{
    font-family:'Press Start 2P',monospace;
    font-size:0.65rem;
    color:var(--amber);
    letter-spacing:0.1em;
  }

  .play-btn{
    font-family:'Press Start 2P',monospace;
    font-size:0.65rem;
    letter-spacing:0.12em;
    padding:14px 28px;
    border-radius:999px;
    border:1px solid var(--cyan);
    color:var(--cyan);
    background:transparent;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:all 0.3s ease;
    cursor:pointer;
    margin-top:4px;
  }
  .play-btn::before{content:'▶';font-size:0.55rem;}
  .play-btn:hover, .play-btn:focus-visible{
    background:linear-gradient(90deg, var(--purple), var(--pink));
    color:#fff;
    border-color:transparent;
    box-shadow:0 0 24px rgba(255,46,151,0.65), 0 0 12px rgba(0,240,255,0.4);
    transform:translateY(-2px);
  }

  .touch-controls{
    display:flex;
    gap:12px;
    margin-top:14px;
  }
  .touch-btn{
    flex:1;
    padding:16px 0;
    border-radius:12px;
    border:1px solid var(--card-border);
    background:rgba(168,85,247,0.08);
    color:var(--text);
    font-size:1.3rem;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    -webkit-user-select:none;
    transition:all 0.15s ease;
  }
  .touch-btn:active{
    background:linear-gradient(90deg, var(--purple), var(--pink));
    border-color:transparent;
    transform:scale(0.96);
  }

  .hint{
    text-align:center;
    color:var(--text-dim);
    font-size:0.8rem;
    letter-spacing:0.05em;
    margin-top:10px;
    opacity:0.8;
  }

  footer{
    text-align:center;
    margin-top:50px;
    color:var(--text-dim);
    font-size:0.8rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="synth-bg" aria-hidden="true">
    <div class="sun"></div>
    <div class="horizon-glow"></div>
  </div>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="wrap">
    <header class="hero">
      <a class="back-link" href="index.html">Arcade</a>
      <span class="eyebrow">Game 02</span>
      <h1 class="title">REDLINE</h1>
      <p class="credit">by <span>Savior</span></p>
    </header>

    <main>
      <div class="arcade-cabinet">
        <div class="hud">
          <div class="stat">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="scoreVal">0</span>
          </div>
          <button class="mute-btn" id="muteBtn" aria-label="Toggle sound" aria-pressed="false">🔊</button>
          <div class="stat" style="align-items:flex-end;">
            <span class="stat-label">BEST</span>
            <span class="stat-value best" id="bestVal">0</span>
          </div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="game" aria-label="Redline game canvas"></canvas>

          <div class="overlay" id="startOverlay">
            <h2>REDLINE</h2>
            <p>Weave through traffic on a neon highway that never stops speeding up. Grab ⚡ boosts for bonus points.</p>
            <button class="play-btn" id="startBtn">Start</button>
          </div>

          <div class="overlay hidden" id="overOverlay">
            <h2 class="crash">WRECKED</h2>
            <p class="score-line" id="finalScore">SCORE 0</p>
            <p id="newBestMsg" style="display:none;color:var(--amber);">New best!</p>
            <button class="play-btn" id="retryBtn">Retry</button>
          </div>
        </div>

        <div class="touch-controls" aria-hidden="true">
          <div class="touch-btn" id="leftBtn">◀</div>
          <div class="touch-btn" id="rightBtn">▶</div>
        </div>
        <p class="hint">Arrow keys / A·D, or tap the pads, to change lanes</p>
      </div>
    </main>

    <footer>© 2026 Retro Arcade 20 — Built by Savior</footer>
  </div>

<script>
(function(){
  'use strict';

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  let cssW = 0, cssH = 0, dpr = 1;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = wrap.getBoundingClientRect();
    cssW = rect.width;
    cssH = rect.height;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Road / perspective helpers ----------
  const LANES = 3;
  function horizonY(){ return cssH * 0.14; }
  function floorY(){ return cssH * 0.90; }
  function roadTopW(){ return cssW * 0.22; }
  function roadBotW(){ return cssW * 0.92; }

  function widthAt(t){
    return roadTopW() + (roadBotW() - roadTopW()) * t;
  }
  function yAt(t){
    return horizonY() + (floorY() - horizonY()) * t;
  }
  function laneX(lane, t){
    const w = widthAt(t);
    const left = cssW/2 - w/2;
    return left + (w/LANES) * (lane + 0.5);
  }

  // ---------- Audio ----------
  let actx = null, masterGain = null, engineOsc1 = null, engineOsc2 = null, engineGain = null, muted = false;
  function ensureAudio(){
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.9;
    masterGain.connect(actx.destination);

    engineGain = actx.createGain();
    engineGain.gain.value = 0.0;
    engineGain.connect(masterGain);

    engineOsc1 = actx.createOscillator();
    engineOsc1.type = 'sawtooth';
    engineOsc1.frequency.value = 55;
    const filt = actx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 320;
    engineOsc1.connect(filt);
    filt.connect(engineGain);
    engineOsc1.start();

    engineOsc2 = actx.createOscillator();
    engineOsc2.type = 'sawtooth';
    engineOsc2.frequency.value = 56.5;
    engineOsc2.connect(filt);
    engineOsc2.start();

    engineFilt = filt;
  }
  let engineFilt = null;

  function beep(freq, dur, type, vol, delay){
    if (!actx || muted) return;
    delay = delay || 0;
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function pickupSound(){
    beep(660, 0.09, 'square', 0.12, 0);
    beep(990, 0.12, 'square', 0.12, 0.06);
  }

  function crashSound(){
    if (!actx || muted) return;
    const t0 = actx.currentTime;
    // noise burst
    const bufSize = actx.sampleRate * 0.35;
    const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++){
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    }
    const noise = actx.createBufferSource();
    noise.buffer = buf;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(0.35, t0);
    ng.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
    const nf = actx.createBiquadFilter();
    nf.type = 'lowpass';
    nf.frequency.value = 1400;
    noise.connect(nf);
    nf.connect(ng);
    ng.connect(masterGain);
    noise.start(t0);
    // thud
    beep(90, 0.3, 'sawtooth', 0.3, 0);
    beep(50, 0.4, 'sawtooth', 0.25, 0.03);
  }

  function setEngine(intensity){
    if (!engineGain || muted){ return; }
    const g = 0.02 + Math.min(intensity, 1) * 0.05;
    engineGain.gain.setTargetAtTime(g, actx.currentTime, 0.1);
    const f = 45 + Math.min(intensity, 1.6) * 70;
    engineOsc1.frequency.setTargetAtTime(f, actx.currentTime, 0.15);
    engineOsc2.frequency.setTargetAtTime(f * 1.03, actx.currentTime, 0.15);
    if (engineFilt) engineFilt.frequency.setTargetAtTime(280 + intensity * 500, actx.currentTime, 0.15);
  }
  function stopEngine(){
    if (!engineGain || !actx) return;
    engineGain.gain.setTargetAtTime(0, actx.currentTime, 0.2);
  }

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-pressed', String(muted));
    if (masterGain) masterGain.gain.value = muted ? 0 : 0.9;
  });

  // ---------- Game state ----------
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const finalScore = document.getElementById('finalScore');
  const newBestMsg = document.getElementById('newBestMsg');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  let best = 0;
  let state = 'idle'; // idle | playing | over
  let player, obstacles, pickups, particles;
  let score = 0, progressRate = 0.36, spawnTimer = 0, pickupTimer = 0, elapsed = 0;
  let lastLanes = [1];
  let shakeT = 0;

  function resetGame(){
    player = { lane: 1, x: laneX(1,1), targetLane: 1 };
    obstacles = [];
    pickups = [];
    particles = [];
    score = 0;
    progressRate = 0.36;
    spawnTimer = 0.6;
    pickupTimer = 2.2;
    elapsed = 0;
    lastLanes = [1];
    shakeT = 0;
    scoreVal.textContent = '0';
  }

  function startGame(){
    ensureAudio();
    if (actx.state === 'suspended') actx.resume();
    resetGame();
    state = 'playing';
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
  }

  function endGame(){
    state = 'over';
    stopEngine();
    crashSound();
    shakeT = 0.35;
    const s = Math.floor(score);
    finalScore.textContent = 'SCORE ' + s;
    if (s > best){
      best = s;
      bestVal.textContent = String(best);
      newBestMsg.style.display = 'block';
    } else {
      newBestMsg.style.display = 'none';
    }
    setTimeout(function(){
      overOverlay.classList.remove('hidden');
    }, 260);
  }

  function moveLane(dir){
    if (state !== 'playing') return;
    player.targetLane = Math.max(0, Math.min(LANES - 1, player.targetLane + dir));
  }

  // ---------- Input ----------
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
    else if (e.key === ' ' || e.key === 'Enter'){
      if (state === 'idle') startGame();
      else if (state === 'over') startGame();
    }
  });
  leftBtn.addEventListener('pointerdown', function(){ moveLane(-1); });
  rightBtn.addEventListener('pointerdown', function(){ moveLane(1); });

  let touchStartX = null;
  wrap.addEventListener('pointerdown', function(e){
    touchStartX = e.clientX;
  });
  wrap.addEventListener('pointerup', function(e){
    if (touchStartX === null) return;
    const dx = e.clientX - touchStartX;
    if (Math.abs(dx) < 24){
      const rect = wrap.getBoundingClientRect();
      const half = rect.left + rect.width/2;
      moveLane(e.clientX < half ? -1 : 1);
    } else {
      moveLane(dx < 0 ? -1 : 1);
    }
    touchStartX = null;
  });

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  // ---------- Spawning ----------
  function spawnObstacle(){
    const openLanes = [];
    for (let l = 0; l < LANES; l++) openLanes.push(l);
    // avoid blocking all lanes at once by leaving at least one lane free among recent spawns
    let lane = openLanes[Math.floor(Math.random() * openLanes.length)];
    obstacles.push({ lane: lane, t: 0, resolved: false, kind: Math.random() < 0.5 ? 'A' : 'B', hue: Math.random() < 0.5 ? '#ff3b3b' : '#ff8a3b' });
    lastLanes.push(lane);
    if (lastLanes.length > 3) lastLanes.shift();
  }

  function spawnPickup(){
    const lane = Math.floor(Math.random() * LANES);
    pickups.push({ lane: lane, t: 0, resolved: false });
  }

  function crashParticles(x, y){
    for (let i = 0; i < 18; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 160;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: 0.5 + Math.random() * 0.4,
        age: 0,
        color: Math.random() < 0.5 ? '#ff3b3b' : '#ffcc33'
      });
    }
  }

  // ---------- Update ----------
  let lastTime = null;
  function update(dt){
    elapsed += dt;
    if (state === 'playing'){
      progressRate = Math.min(1.15, 0.36 + score * 0.00045);
      setEngine(progressRate);

      score += progressRate * dt * 55;
      scoreVal.textContent = String(Math.floor(score));

      // player lane smoothing
      const targetX = laneX(player.targetLane, 1);
      player.lane = player.targetLane;
      player.x += (targetX - player.x) * Math.min(1, dt * 12);

      // spawn timers
      spawnTimer -= dt;
      if (spawnTimer <= 0){
        spawnObstacle();
        const base = 1.35 - progressRate * 0.55;
        spawnTimer = Math.max(0.55, base) + Math.random() * 0.35;
      }
      pickupTimer -= dt;
      if (pickupTimer <= 0){
        spawnPickup();
        pickupTimer = 2.6 + Math.random() * 2.2;
      }

      // update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--){
        const o = obstacles[i];
        o.t += progressRate * dt * 0.9;
        if (!o.resolved && o.t > 0.93 && o.t < 1.08 && o.lane === player.lane){
          o.resolved = true;
          crashParticles(player.x, yAt(1));
          endGame();
        }
        if (o.t > 1.2) obstacles.splice(i, 1);
      }

      // update pickups
      for (let i = pickups.length - 1; i >= 0; i--){
        const p = pickups[i];
        p.t += progressRate * dt * 0.9;
        if (!p.resolved && p.t > 0.9 && p.t < 1.1 && p.lane === player.lane){
          p.resolved = true;
          score += 50;
          pickupSound();
          pickups.splice(i, 1);
          continue;
        }
        if (p.t > 1.2) pickups.splice(i, 1);
      }
    }

    // particles always update for crash effect
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.age += dt;
      if (p.age > p.life){ particles.splice(i,1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
    }

    if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
  }

  // ---------- Draw ----------
  function drawRoad(t0){
    const topW = widthAt(0), botW = widthAt(1);
    const hy = horizonY(), fy = floorY();
    const cx = cssW/2;

    // road surface
    const grad = ctx.createLinearGradient(0, hy, 0, fy);
    grad.addColorStop(0, '#160a2e');
    grad.addColorStop(1, '#0e0620');
    ctx.beginPath();
    ctx.moveTo(cx - topW/2, hy);
    ctx.lineTo(cx + topW/2, hy);
    ctx.lineTo(cx + botW/2, fy);
    ctx.lineTo(cx - botW/2, fy);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // edge glow lines
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,240,255,0.55)';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(cx - topW/2, hy); ctx.lineTo(cx - botW/2, fy);
    ctx.moveTo(cx + topW/2, hy); ctx.lineTo(cx + botW/2, fy);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // lane dividers, animated dashes
    ctx.strokeStyle = 'rgba(255,46,151,0.45)';
    ctx.lineWidth = 1.5;
    for (let lane = 1; lane < LANES; lane++){
      const segments = 10;
      for (let s = 0; s < segments; s++){
        let tA = (s / segments + t0) % 1;
        let tB = tA + (0.5/segments);
        if (tB > 1) continue;
        const xA = cx - widthAt(tA)/2 + (widthAt(tA)/LANES) * lane;
        const yA = yAt(tA);
        const xB = cx - widthAt(tB)/2 + (widthAt(tB)/LANES) * lane;
        const yB = yAt(tB);
        ctx.beginPath();
        ctx.moveTo(xA, yA);
        ctx.lineTo(xB, yB);
        ctx.stroke();
      }
    }
  }

  function drawCarShape(x, y, scale, bodyColor, glowColor){
    const w = 34 * scale, h = 52 * scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 14 * scale;
    ctx.fillStyle = bodyColor;
    // body
    ctx.beginPath();
    ctx.moveTo(-w*0.32, h*0.5);
    ctx.lineTo(-w*0.5, h*0.05);
    ctx.lineTo(-w*0.28, -h*0.42);
    ctx.lineTo(w*0.28, -h*0.42);
    ctx.lineTo(w*0.5, h*0.05);
    ctx.lineTo(w*0.32, h*0.5);
    ctx.closePath();
    ctx.fill();
    // windshield
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(10,1,24,0.55)';
    ctx.beginPath();
    ctx.moveTo(-w*0.2, -h*0.05);
    ctx.lineTo(-w*0.18, -h*0.3);
    ctx.lineTo(w*0.18, -h*0.3);
    ctx.lineTo(w*0.2, -h*0.05);
    ctx.closePath();
    ctx.fill();
    // headlight glow (for player, at bottom facing viewer) / taillight for obstacles
    ctx.fillStyle = glowColor;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(-w*0.32, h*0.32, w*0.18, h*0.08);
    ctx.fillRect(w*0.14, h*0.32, w*0.18, h*0.08);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawPickup(x, y, scale, t){
    const s = 16 * scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 6);
    ctx.shadowColor = '#ffcc33';
    ctx.shadowBlur = 16 * scale;
    ctx.fillStyle = '#ffcc33';
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s, 0);
    ctx.lineTo(0, s);
    ctx.lineTo(-s, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0, 0, cssW, cssH);

    let ox = 0, oy = 0;
    if (shakeT > 0){
      ox = (Math.random() - 0.5) * 10 * (shakeT / 0.35);
      oy = (Math.random() - 0.5) * 10 * (shakeT / 0.35);
    }
    ctx.save();
    ctx.translate(ox, oy);

    const t0 = (elapsed * (0.5 + progressRate * 0.4)) % 1;
    drawRoad(t0);

    // sort by t so nearer objects draw over farther ones
    const drawables = [];
    obstacles.forEach(o => drawables.push({ type: 'obstacle', ref: o, t: o.t }));
    pickups.forEach(p => drawables.push({ type: 'pickup', ref: p, t: p.t }));
    drawables.sort((a,b) => a.t - b.t);

    drawables.forEach(d => {
      const t = Math.min(1.05, d.ref.t);
      const x = laneX(d.ref.lane, t);
      const y = yAt(t);
      const scale = 0.25 + t * 0.85;
      if (d.type === 'obstacle'){
        drawCarShape(x, y, scale, d.ref.hue, d.ref.hue);
      } else {
        drawPickup(x, y, scale, elapsed);
      }
    });

    // player car
    if (state !== 'idle'){
      drawCarShape(player.x, yAt(1), 1, '#00f0ff', '#00f0ff');
    }

    // particles
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    ctx.restore();
  }

  function loop(ts){
    if (lastTime === null) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    lastTime = ts;
    if (dt > 0.05) dt = 0.05; // clamp for tab-switch jumps
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // initial idle-state static scene
  player = { lane: 1, x: laneX(1,1), targetLane: 1 };
  obstacles = []; pickups = []; particles = [];
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
