<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0014">
<title>Game 03 — Neon Slither | Retro Arcade 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #05010f;
    --deep: #0d0122;
    --panel-a: rgba(16,4,38,.92);
    --panel-b: rgba(28,6,58,.92);
    --pink: #ff2fd8;
    --purple: #8b2fff;
    --cyan: #23e8ff;
    --lavender: #b9a3e8;
    --text-main: #f2ecff;
    --text-muted: #a996d1;
    --food: #23e8ff;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--void);
    color:var(--text-main);
    font-family:'Rajdhani', sans-serif;
    overflow:hidden;
    position:relative;
    min-height:100vh;
    min-height:100dvh;
  }

  /* ---------- background layers (fixed, transform/opacity only — cheap on GPU) ---------- */
  .bg-stars{
    position:fixed; inset:0; z-index:-4;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.9) 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 15%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 60%, rgba(35,232,255,.8) 50%, transparent 51%),
      radial-gradient(1px 1px at 10% 75%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 45% 85%, rgba(255,47,216,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 45%, rgba(255,255,255,.5) 50%, transparent 51%);
    background-size: 220px 220px;
    opacity:.7;
  }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(2,0,10,.75) 100%);
  }

  /* ---------- layout ---------- */
  .stage{
    position:relative; z-index:3;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    align-items:center;
    padding:.6rem .8rem calc(.6rem + env(safe-area-inset-bottom)) .8rem;
    max-width:560px; margin:0 auto;
  }

  .topbar{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    gap:.5rem;
    padding:.3rem 0 .6rem;
    flex-shrink:0;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:.4rem;
    text-decoration:none;
    color:var(--cyan);
    font-family:'Orbitron', sans-serif;
    font-weight:700; font-size:.65rem; letter-spacing:.12em; text-transform:uppercase;
    padding:.5rem .7rem;
    background:linear-gradient(90deg, rgba(255,47,216,.14), rgba(35,232,255,.14));
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    box-shadow:0 0 0 1px rgba(35,232,255,.5) inset;
  }
  .title-mini{
    font-family:'Press Start 2P', monospace;
    font-size:.7rem;
    text-align:center;
    color:var(--text-main);
    text-shadow:0 0 8px var(--pink), 0 0 18px var(--purple);
    letter-spacing:.02em;
  }
  .topbar-actions{ display:flex; align-items:center; gap:.4rem; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    background:linear-gradient(90deg, rgba(255,47,216,.14), rgba(35,232,255,.14));
    box-shadow:0 0 0 1px rgba(35,232,255,.5) inset;
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    border:none; color:var(--cyan); font-size:1rem; cursor:pointer;
    touch-action:none;
  }
  .icon-btn:active{ background:linear-gradient(90deg, var(--pink), var(--cyan)); color:#0a0014; }

  .scorebar{
    width:100%;
    display:flex; justify-content:space-between;
    font-family:'Orbitron', sans-serif;
    font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--lavender);
    margin-bottom:.5rem;
    flex-shrink:0;
  }
  .scorebar b{ color:var(--cyan); font-size:.95rem; text-shadow:0 0 8px rgba(35,232,255,.6); }
  .scorebar .best b{ color:var(--pink); text-shadow:0 0 8px rgba(255,47,216,.6); }

  .board-wrap{
    position:relative;
    width:min(92vw, calc(100dvh - 165px), 560px);
    aspect-ratio:1/1;
    flex-shrink:1;
    flex-grow:1;
    clip-path:polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    background:linear-gradient(165deg, var(--panel-a), var(--panel-b));
    box-shadow:0 0 0 1px rgba(35,232,255,.35) inset, 0 0 40px rgba(139,47,255,.35);
    touch-action:none;
  }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.9rem;
    text-align:center; padding:1.2rem;
    background:rgba(5,1,15,.82);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .overlay h3{
    font-family:'Press Start 2P', monospace;
    font-size:1rem;
    margin:0;
    color:var(--text-main);
    text-shadow:0 0 10px var(--pink), 0 0 22px var(--purple);
  }
  .overlay p{ margin:0; color:var(--text-muted); font-size:.95rem; line-height:1.5; max-width:24em; }
  .overlay .big-score{ font-family:'Orbitron',sans-serif; font-size:2.2rem; font-weight:800; color:var(--cyan); text-shadow:0 0 14px rgba(35,232,255,.7); }
  .overlay .record-badge{
    font-family:'Orbitron', sans-serif; font-weight:700; font-size:.75rem; letter-spacing:.15em;
    color:#0a0014; background:linear-gradient(90deg, var(--pink), var(--cyan));
    padding:.35rem .8rem; border-radius:3px; text-transform:uppercase;
    animation:pulseBadge 1s ease-in-out infinite;
  }
  @keyframes pulseBadge{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }

  .overlay-btn{
    font-family:'Orbitron', sans-serif; font-weight:700; font-size:.75rem; letter-spacing:.15em; text-transform:uppercase;
    text-decoration:none;
    color:var(--cyan); background:linear-gradient(90deg, rgba(255,47,216,.14), rgba(35,232,255,.14));
    border:none; cursor:pointer;
    padding:.75rem 1.6rem;
    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    box-shadow:0 0 0 1px rgba(35,232,255,.55) inset;
  }
  .overlay-btn.primary{
    color:#0a0014; background:linear-gradient(90deg, var(--pink), var(--cyan));
    box-shadow:0 0 0 1px rgba(255,255,255,.6) inset, 0 0 22px rgba(255,47,216,.6);
  }
  .overlay-actions{ display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center; }

  .countdown-num{
    font-family:'Press Start 2P', monospace;
    font-size:2.6rem;
    color:var(--cyan);
    text-shadow:0 0 20px var(--cyan), 0 0 40px var(--purple);
  }

  .hint{
    font-size:.72rem; color:var(--text-muted); text-align:center; margin-top:.6rem; flex-shrink:0;
    letter-spacing:.03em;
  }

  .swipe-glyph{
    display:inline-flex; align-items:center; justify-content:center;
    gap:.3rem; margin-top:.15rem;
    font-size:.85rem; color:var(--cyan); opacity:.55;
  }
</style>
</head>
<body>

  <div class="bg-stars"></div>
  <div class="vignette"></div>

  <div class="stage">

    <div class="topbar">
      <a class="back-link" href="index.html">◀ Arcade</a>
      <div class="title-mini">GAME 03</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">❚❚</button>
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Toggle sound">🔊</button>
      </div>
    </div>

    <div class="scorebar">
      <div>SCORE <b id="scoreVal">0</b></div>
      <div class="best">BEST <b id="bestVal">0</b></div>
    </div>

    <div class="board-wrap" id="boardWrap">
      <canvas id="board" aria-label="Snake game board"></canvas>

      <div class="overlay show" id="startOverlay">
        <h3>NEON SLITHER</h3>
        <p>Guide your snake to the glowing orbs. Grow long, avoid the walls, don't bite your own tail.</p>
        <div class="overlay-actions">
          <button class="overlay-btn primary" id="startBtn" type="button">TAP TO START</button>
        </div>
      </div>

      <div class="overlay" id="countdownOverlay">
        <div class="countdown-num" id="countdownNum">3</div>
      </div>

      <div class="overlay" id="pauseOverlay">
        <h3>PAUSED</h3>
        <div class="overlay-actions">
          <button class="overlay-btn primary" id="resumeBtn" type="button">RESUME</button>
        </div>
      </div>

      <div class="overlay" id="gameOverOverlay">
        <h3>GAME OVER</h3>
        <div class="big-score" id="finalScore">0</div>
        <div class="record-badge" id="recordBadge" style="display:none;">NEW HIGH SCORE</div>
        <div class="overlay-actions">
          <button class="overlay-btn primary" id="retryBtn" type="button">PLAY AGAIN</button>
          <a class="overlay-btn" href="index.html">ARCADE</a>
        </div>
      </div>
    </div>

    <p class="hint">Swipe on the board to steer<br><span class="swipe-glyph">◀ ▲ ▼ ▶</span><br>Arrow keys / WASD also work</p>
  </div>

<script>
(function(){
  'use strict';

  /* ===================== CONFIG ===================== */
  var COLS = 18, ROWS = 18;
  var BASE_TICK_MS = 150, MIN_TICK_MS = 78, TICK_STEP = 3;
  var HIGH_SCORE_KEY = 'savior_arcade5_game3_highscore';
  var MUTE_KEY = 'savior_arcade5_muted';

  /* ===================== DOM ===================== */
  var boardWrap = document.getElementById('boardWrap');
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d', { alpha: true });
  var scoreVal = document.getElementById('scoreVal');
  var bestVal = document.getElementById('bestVal');
  var startOverlay = document.getElementById('startOverlay');
  var countdownOverlay = document.getElementById('countdownOverlay');
  var countdownNum = document.getElementById('countdownNum');
  var pauseOverlay = document.getElementById('pauseOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var finalScore = document.getElementById('finalScore');
  var recordBadge = document.getElementById('recordBadge');
  var startBtn = document.getElementById('startBtn');
  var retryBtn = document.getElementById('retryBtn');
  var resumeBtn = document.getElementById('resumeBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var soundBtn = document.getElementById('soundBtn');

  /* ===================== AUDIO (Web Audio API, lazy init) ===================== */
  var audioCtx = null;
  var muted = localStorage.getItem(MUTE_KEY) === '1';
  updateSoundBtn();

  function ensureAudio(){
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freqStart, freqEnd, duration, type, volume, delay){
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(Math.max(freqStart,1), t0);
    if (freqEnd && freqEnd !== freqStart) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0 + duration);
    }
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  function sfxEat(){ tone(520, 900, 0.11, 'square', 0.16); }
  function sfxTurn(){ tone(260, 260, 0.03, 'square', 0.035); }
  function sfxCrash(){ tone(220, 50, 0.42, 'sawtooth', 0.2); }
  function sfxUi(){ tone(440, 440, 0.05, 'square', 0.08); }
  function sfxCountdown(){ tone(440, 440, 0.08, 'square', 0.12); }
  function sfxGo(){ tone(660, 1100, 0.2, 'square', 0.2); }
  function sfxHighScore(){
    tone(523,523,0.1,'square',0.18,0);
    tone(659,659,0.1,'square',0.18,0.11);
    tone(784,784,0.14,'square',0.2,0.22);
    tone(1046,1046,0.26,'square',0.22,0.36);
  }

  function toggleMute(){
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
    updateSoundBtn();
    if (!muted) { ensureAudio(); sfxUi(); }
  }
  function updateSoundBtn(){ soundBtn.textContent = muted ? '🔇' : '🔊'; }

  /* ===================== STATE ===================== */
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var cssSize = 0, cellSize = 0;
  var gridCache = document.createElement('canvas');

  var snake, direction, dirQueue, food, score, highScore, tickMs;
  var running = false, paused = false, over = false;
  var accumulator = 0, lastFrameTime = 0, rafId = null;
  var colorCache = [];

  highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0', 10) || 0;
  bestVal.textContent = highScore;

  /* ===================== SIZING ===================== */
  function resizeCanvas(){
    var rect = boardWrap.getBoundingClientRect();
    cssSize = Math.floor(Math.min(rect.width, rect.height));
    if (cssSize <= 0) return;
    cellSize = cssSize / COLS;

    canvas.width = Math.floor(cssSize * dpr);
    canvas.height = Math.floor(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    buildGridCache();
    render(performance.now());
  }

  function buildGridCache(){
    gridCache.width = Math.floor(cssSize * dpr);
    gridCache.height = Math.floor(cssSize * dpr);
    var gctx = gridCache.getContext('2d');
    gctx.clearRect(0, 0, gridCache.width, gridCache.height);
    gctx.strokeStyle = 'rgba(139,47,255,0.14)';
    gctx.lineWidth = 1;
    var cs = cellSize * dpr;
    var i;
    for (i = 0; i <= COLS; i++) {
      gctx.beginPath();
      gctx.moveTo(Math.round(i * cs) + 0.5, 0);
      gctx.lineTo(Math.round(i * cs) + 0.5, gridCache.height);
      gctx.stroke();
    }
    for (i = 0; i <= ROWS; i++) {
      gctx.beginPath();
      gctx.moveTo(0, Math.round(i * cs) + 0.5);
      gctx.lineTo(gridCache.width, Math.round(i * cs) + 0.5);
      gctx.stroke();
    }
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 120);
  });
  window.addEventListener('orientationchange', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 200);
  });

  /* ===================== COLOR CACHE (avoid per-frame gradient cost) ===================== */
  var PINK_RGB = [255, 47, 216];
  var CYAN_RGB = [35, 232, 255];
  function lerpColor(a, b, t){
    var r = Math.round(a[0] + (b[0]-a[0])*t);
    var g = Math.round(a[1] + (b[1]-a[1])*t);
    var bl = Math.round(a[2] + (b[2]-a[2])*t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  function rebuildColorCache(){
    var len = snake.length;
    colorCache = new Array(len);
    for (var i = 0; i < len; i++) {
      colorCache[i] = lerpColor(PINK_RGB, CYAN_RGB, len > 1 ? i/(len-1) : 0);
    }
  }

  /* ===================== GAME LOGIC ===================== */
  function resetGame(){
    var midX = Math.floor(COLS/2), midY = Math.floor(ROWS/2);
    snake = [
      { x: midX-1, y: midY },
      { x: midX-2, y: midY },
      { x: midX-3, y: midY }
    ];
    direction = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    tickMs = BASE_TICK_MS;
    over = false;
    scoreVal.textContent = '0';
    rebuildColorCache();
    placeFood();
  }

  function placeFood(){
    var attempts = 0;
    var fx, fy, collides;
    do {
      fx = Math.floor(Math.random() * COLS);
      fy = Math.floor(Math.random() * ROWS);
      collides = snake.some(function(s){ return s.x === fx && s.y === fy; });
      attempts++;
    } while (collides && attempts < 200);
    food = { x: fx, y: fy };
  }

  function queueDirection(dx, dy){
    if (over) return;
    if (!running) { beginStart(); return; }
    var lastDir = dirQueue.length ? dirQueue[dirQueue.length-1] : direction;
    if (dx === -lastDir.x && dy === -lastDir.y) return; // no reversing
    if (dx === lastDir.x && dy === lastDir.y) return;   // no duplicate
    if (dirQueue.length < 2) {
      dirQueue.push({ x: dx, y: dy });
      sfxTurn();
    }
  }

  function update(){
    if (dirQueue.length) direction = dirQueue.shift();

    var newHead = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
      return endGame();
    }

    var willGrow = (newHead.x === food.x && newHead.y === food.y);
    var bodyToCheck = willGrow ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i < bodyToCheck.length; i++) {
      if (bodyToCheck[i].x === newHead.x && bodyToCheck[i].y === newHead.y) {
        return endGame();
      }
    }

    snake.unshift(newHead);
    if (willGrow) {
      score++;
      scoreVal.textContent = String(score);
      tickMs = Math.max(MIN_TICK_MS, BASE_TICK_MS - score * TICK_STEP);
      rebuildColorCache();
      placeFood();
      sfxEat();
    } else {
      snake.pop();
    }
  }

  function endGame(){
    running = false;
    over = true;
    finalScore.textContent = String(score);
    var isRecord = score > highScore;
    if (isRecord) {
      highScore = score;
      localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      bestVal.textContent = String(highScore);
      recordBadge.style.display = 'inline-block';
      sfxHighScore();
    } else {
      recordBadge.style.display = 'none';
      sfxCrash();
    }
    gameOverOverlay.classList.add('show');
  }

  /* ===================== RENDER ===================== */
  function render(){
    if (!cssSize) return;
    ctx.clearRect(0, 0, cssSize, cssSize);

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(gridCache, 0, 0);
    ctx.restore();

    if (!snake) return;

    // food
    var fcx = (food.x + 0.5) * cellSize;
    var fcy = (food.y + 0.5) * cellSize;
    var pulse = 0.75 + 0.25 * Math.sin(performance.now() / 180);
    ctx.save();
    ctx.shadowColor = 'rgba(35,232,255,0.9)';
    ctx.shadowBlur = 10 * pulse;
    ctx.fillStyle = '#eafcff';
    ctx.beginPath();
    ctx.arc(fcx, fcy, cellSize * 0.32 * pulse + cellSize*0.18, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // snake body
    var pad = Math.max(1, cellSize * 0.08);
    for (var i = snake.length - 1; i >= 0; i--) {
      var seg = snake[i];
      ctx.fillStyle = colorCache[i] || '#ff2fd8';
      ctx.fillRect(
        seg.x * cellSize + pad,
        seg.y * cellSize + pad,
        cellSize - pad*2,
        cellSize - pad*2
      );
    }

    // head glow + eyes
    var head = snake[0];
    ctx.save();
    ctx.shadowColor = 'rgba(255,47,216,0.85)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = colorCache[0] || '#ff2fd8';
    ctx.fillRect(head.x*cellSize + pad, head.y*cellSize + pad, cellSize - pad*2, cellSize - pad*2);
    ctx.restore();

    ctx.fillStyle = '#0a0014';
    var eyeR = Math.max(1, cellSize * 0.09);
    var ex1, ey1, ex2, ey2;
    var cx = head.x*cellSize + cellSize/2, cy = head.y*cellSize + cellSize/2;
    var off = cellSize * 0.2;
    if (direction.x === 1)      { ex1=cx+off; ey1=cy-off*0.7; ex2=cx+off; ey2=cy+off*0.7; }
    else if (direction.x === -1){ ex1=cx-off; ey1=cy-off*0.7; ex2=cx-off; ey2=cy+off*0.7; }
    else if (direction.y === 1) { ex1=cx-off*0.7; ey1=cy+off; ex2=cx+off*0.7; ey2=cy+off; }
    else                        { ex1=cx-off*0.7; ey1=cy-off; ex2=cx+off*0.7; ey2=cy-off; }
    ctx.beginPath(); ctx.arc(ex1, ey1, eyeR, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, ey2, eyeR, 0, Math.PI*2); ctx.fill();
  }

  /* ===================== LOOP ===================== */
  function loop(timestamp){
    rafId = requestAnimationFrame(loop);

    if (!running || paused) { render(); return; }

    if (!lastFrameTime) lastFrameTime = timestamp;
    var delta = timestamp - lastFrameTime;
    if (delta > 250) delta = 250; // clamp huge gaps (tab was backgrounded)
    lastFrameTime = timestamp;
    accumulator += delta;

    var steps = 0;
    while (accumulator >= tickMs && steps < 5) {
      update();
      accumulator -= tickMs;
      steps++;
      if (over) break;
    }
    render();
  }

  /* ===================== FLOW CONTROL ===================== */
  function beginStart(){
    ensureAudio();
    startOverlay.classList.remove('show');
    gameOverOverlay.classList.remove('show');
    resetGame();
    render();
    runCountdown();
  }

  function runCountdown(){
    countdownOverlay.classList.add('show');
    var count = 3;
    countdownNum.textContent = String(count);
    sfxCountdown();
    var iv = setInterval(function(){
      count--;
      if (count > 0) {
        countdownNum.textContent = String(count);
        sfxCountdown();
      } else {
        clearInterval(iv);
        countdownNum.textContent = 'GO';
        sfxGo();
        setTimeout(function(){
          countdownOverlay.classList.remove('show');
          running = true;
          paused = false;
          lastFrameTime = 0;
          accumulator = 0;
        }, 260);
      }
    }, 550);
  }

  function togglePause(){
    if (!running || over) return;
    paused = !paused;
    if (paused) {
      pauseOverlay.classList.add('show');
    } else {
      pauseOverlay.classList.remove('show');
      lastFrameTime = 0;
    }
    sfxUi();
  }

  /* ===================== INPUT ===================== */
  document.addEventListener('keydown', function(e){
    if (e.repeat) return;
    var k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].indexOf(k) !== -1) {
      e.preventDefault();
    }
    ensureAudio();
    if (k === 'arrowup' || k === 'w') queueDirection(0, -1);
    else if (k === 'arrowdown' || k === 's') queueDirection(0, 1);
    else if (k === 'arrowleft' || k === 'a') queueDirection(-1, 0);
    else if (k === 'arrowright' || k === 'd') queueDirection(1, 0);
    else if (k === ' ') togglePause();
  }, { passive: false });

  var touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    ensureAudio();
    if (!running && !over) beginStart();
  }, { passive: true });

  canvas.addEventListener('touchend', function(e){
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    var absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 22) return;
    if (absX > absY) queueDirection(dx > 0 ? 1 : -1, 0);
    else queueDirection(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  startBtn.addEventListener('click', function(){ beginStart(); });
  retryBtn.addEventListener('click', function(){
    gameOverOverlay.classList.remove('show');
    resetGame();
    render();
    runCountdown();
  });
  pauseBtn.addEventListener('click', togglePause);
  resumeBtn.addEventListener('click', togglePause);
  soundBtn.addEventListener('click', toggleMute);

  document.addEventListener('visibilitychange', function(){
    if (document.hidden && running && !paused) togglePause();
  });

  /* ===================== INIT ===================== */
  resizeCanvas();
  rafId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
